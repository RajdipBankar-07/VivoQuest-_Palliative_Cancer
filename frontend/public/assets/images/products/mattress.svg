<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.1" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Medical Grid Pattern -->
  <g opacity="0.04" stroke="#0f172a" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="50" y1="0" x2="550" y2="500"/>
  </g>

  <!-- Central Card Surface -->
  <rect x="50" y="40" width="500" height="420" rx="24" fill="#ffffff" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top VivoQuest Header Ribbon -->
  <rect x="50" y="40" width="500" height="50" rx="24" fill="#0f172a"/>
  <rect x="50" y="65" width="500" height="25" fill="#0f172a"/>
  <text x="75" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="1">VIVOQUEST</text>
  <text x="165" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">MEDICAL EQUIPMENT</text>
  <rect x="420" y="55" width="110" height="22" rx="11" fill="#0284c7" fill-opacity="0.25"/>
  <text x="475" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FALL PREVENTION & SDOH</text>

  <!-- Illustration Viewport -->
  <g transform="translate(100, 110)">
    
      <!-- Mattress Base Grid Surface -->
      <rect x="60" y="70" width="210" height="140" rx="12" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
      <!-- Bubble Air Cells Simulation -->
      <g fill="#38bdf8" stroke="#0284c7" stroke-width="1.5">
        <circle cx="90" cy="95" r="14"/> <circle cx="125" cy="95" r="14"/> <circle cx="160" cy="95" r="14"/> <circle cx="195" cy="95" r="14"/> <circle cx="230" cy="95" r="14"/>
        <circle cx="105" cy="125" r="14"/> <circle cx="140" cy="125" r="14"/> <circle cx="175" cy="125" r="14"/> <circle cx="210" cy="125" r="14"/> <circle cx="245" cy="125" r="14"/>
        <circle cx="90" cy="155" r="14"/> <circle cx="125" cy="155" r="14"/> <circle cx="160" cy="155" r="14"/> <circle cx="195" cy="155" r="14"/> <circle cx="230" cy="155" r="14"/>
        <circle cx="105" cy="185" r="14"/> <circle cx="140" cy="185" r="14"/> <circle cx="175" cy="185" r="14"/> <circle cx="210" cy="185" r="14"/> <circle cx="245" cy="185" r="14"/>
      </g>
      <!-- Ultra-Silent Compressor Pump Unit -->
      <rect x="290" y="100" width="80" height="95" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="3" filter="url(#shadow)"/>
      <circle cx="330" cy="135" r="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
      <line x1="330" y1="135" x2="330" y2="125" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
      <text x="330" y="170" font-family="sans-serif" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">PRESSURE</text>
      <!-- Twin Air Delivery Hoses -->
      <path d="M 270 130 C 280 130 280 140 290 140" stroke="#0284c7" stroke-width="5" fill="none"/>
      <path d="M 270 145 C 280 145 280 155 290 155" stroke="#38bdf8" stroke-width="5" fill="none"/>
    
  </g>

  <!-- Product Title & Certification Footer -->
  <line x1="75" y1="400" x2="525" y2="400" stroke="#f1f5f9" stroke-width="2"/>
  <text x="75" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Alternating Pressure Bubble Mattress</text>
  <g transform="translate(75, 435)">
    <circle cx="5" cy="5" r="4" fill="#10b981"/>
    <text x="16" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">Verified Clinical Standard &bull; Biomedical Depot Tested</text>
  </g>
</svg>