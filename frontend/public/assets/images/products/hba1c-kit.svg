<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.1" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Medical Grid Pattern -->
  <g opacity="0.04" stroke="#0f172a" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="50" y1="0" x2="550" y2="500"/>
  </g>

  <!-- Central Card Surface -->
  <rect x="50" y="40" width="500" height="420" rx="24" fill="#ffffff" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top VivoQuest Header Ribbon -->
  <rect x="50" y="40" width="500" height="50" rx="24" fill="#0f172a"/>
  <rect x="50" y="65" width="500" height="25" fill="#0f172a"/>
  <text x="75" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="1">VIVOQUEST</text>
  <text x="165" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">MEDICAL EQUIPMENT</text>
  <rect x="420" y="55" width="110" height="22" rx="11" fill="#dc2626" fill-opacity="0.25"/>
  <text x="475" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CLINICAL LAB</text>

  <!-- Illustration Viewport -->
  <g transform="translate(100, 110)">
    
      <!-- Sterile Collection Kit Box -->
      <rect x="70" y="70" width="260" height="140" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
      <rect x="70" y="70" width="260" height="35" rx="16" fill="#dc2626"/>
      <rect x="70" y="90" width="260" height="15" fill="#dc2626"/>
      <text x="200" y="92" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">DIABETIC HEALTHCARE SCREENING</text>
      <!-- Blood Collection Tubes -->
      <g transform="translate(100, 120)">
        <rect x="0" y="15" width="22" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
        <rect x="2" y="35" width="18" height="38" rx="6" fill="#b91c1c" opacity="0.85"/>
        <rect x="-2" y="5" width="26" height="15" rx="4" fill="#7c3aed"/>
        <text x="11" y="55" font-family="sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">EDTA</text>
      </g>
      <g transform="translate(145, 120)">
        <rect x="0" y="15" width="22" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
        <rect x="2" y="45" width="18" height="28" rx="6" fill="#b91c1c" opacity="0.85"/>
        <rect x="-2" y="5" width="26" height="15" rx="4" fill="#eab308"/>
        <text x="11" y="60" font-family="sans-serif" font-size="7" fill="#ffffff" text-anchor="middle">GLUC</text>
      </g>
      <!-- Sterile Lancet & Swabs -->
      <rect x="200" y="130" width="100" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="250" y="150" font-family="sans-serif" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">STERILE SWABS</text>
      <text x="250" y="165" font-family="sans-serif" font-size="9" font-weight="600" fill="#10b981" text-anchor="middle">&amp; SAFETY LANCET</text>
    
  </g>

  <!-- Product Title & Certification Footer -->
  <line x1="75" y1="400" x2="525" y2="400" stroke="#f1f5f9" stroke-width="2"/>
  <text x="75" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">HbA1c & Diabetic Screening Kit</text>
  <g transform="translate(75, 435)">
    <circle cx="5" cy="5" r="4" fill="#10b981"/>
    <text x="16" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">Verified Clinical Standard &bull; Biomedical Depot Tested</text>
  </g>
</svg>