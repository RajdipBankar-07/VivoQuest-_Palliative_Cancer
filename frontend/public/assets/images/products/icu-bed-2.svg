<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.1" flood-color="#0f172a"/>
    </filter>
  </defs>

  <rect width="600" height="500" fill="url(#bgGrad2)"/>
  
  <!-- Central Card Surface -->
  <rect x="50" y="40" width="500" height="420" rx="24" fill="#ffffff" filter="url(#shadow2)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Ribbon -->
  <rect x="50" y="40" width="500" height="50" rx="24" fill="#0f172a"/>
  <rect x="50" y="65" width="500" height="25" fill="#0f172a"/>
  <text x="75" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="1">VIVOQUEST</text>
  <text x="165" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">TECHNICAL SPECIFICATION VIEW</text>
  <rect x="420" y="55" width="110" height="22" rx="11" fill="#0d9488" fill-opacity="0.25"/>
  <text x="475" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">SPECIFICATIONS</text>

  <!-- Detail Schematic View -->
  <g transform="translate(90, 120)">
    <rect x="0" y="0" width="420" height="240" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Schematic Blueprint Lines -->
    <circle cx="210" cy="110" r="70" fill="none" stroke="#0d9488" stroke-width="3" opacity="0.3"/>
    <circle cx="210" cy="110" r="50" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="4"/>
    <circle cx="210" cy="110" r="10" fill="#0d9488" opacity="0.8"/>
    <line x1="70" y1="110" x2="350" y2="110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="210" y1="20" x2="210" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4"/>
    
    <!-- Dimension Callouts -->
    <rect x="140" y="65" width="140" height="30" rx="6" fill="#0f172a"/>
    <text x="210" y="85" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">220 KG CAPACITY</text>

    <text x="210" y="160" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">ICU-BED</text>
    <text x="210" y="180" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Linak Actuator Range &bull; Trendelenburg Degrees</text>
  </g>

  <!-- Product Title & Certification Footer -->
  <line x1="75" y1="400" x2="525" y2="400" stroke="#f1f5f9" stroke-width="2"/>
  <text x="75" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#0f172a">ICU-BED &bull; Dimension &amp; Component Map</text>
  <g transform="translate(75, 435)">
    <circle cx="5" cy="5" r="4" fill="#0284c7"/>
    <text x="16" y="9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b">Biomedical Engineering Certified &bull; ISO 13485 Standards</text>
  </g>
</svg>